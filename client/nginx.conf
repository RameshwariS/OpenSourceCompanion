server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Do not add add_header lines inside the locations below: nginx would then
  # stop inheriting these server-level headers.
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # The browser talks only to nginx. API calls are forwarded to the backend container.
  location /api/ {
    proxy_pass http://backend:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Socket.io needs the HTTP -> WebSocket upgrade headers
  location /socket.io/ {
    proxy_pass http://backend:5000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # Vite file names contain a content hash, so they can be cached "forever"
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  # React Router: any other path serves index.html (never cached, so deploys show up at once)
  location / {
    expires -1;
    try_files $uri /index.html;
  }
}